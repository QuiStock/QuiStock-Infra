apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-chatbot
  namespace: api-chatbot
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api-chatbot
  template:
    metadata:
      labels:
        app: api-chatbot
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      terminationGracePeriodSeconds: 30
      containers:
        - name: api-chatbot
          image: ghcr.io/quistock/ai-multi-agent@sha256:28ddec60c509b52adf3b50c2982a336cfc92f6634091359544f738215e0f4da3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: OBSERVABILITY_FRONTEND_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: api-runtime
                  key: OBSERVABILITY_FRONTEND_ORIGIN
            - name: AUTH_BYPASS_LOCAL_TESTS
              value: "false"
            - name: APP_ENVIRONMENT
              value: "production"
          envFrom:
            - configMapRef:
                name: chatbot-config
            - secretRef:
                name: chatbot-external
            - secretRef:
                name: chatbot-runtime-external
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health
              port: http
            timeoutSeconds: 40
            periodSeconds: 45
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
        - name: summary-worker
          image: ghcr.io/quistock/ai-multi-agent-worker@sha256:ed3bfd4a2dc43c72d8330adccccd46e5cbf14c6438158e9d0c5224d003896b35
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "src.memory.worker.run_summary_worker"]
          env:
            - name: AUTH_BYPASS_LOCAL_TESTS
              value: "false"
            - name: APP_ENVIRONMENT
              value: "production"
          envFrom:
            - configMapRef:
                name: chatbot-config
            - secretRef:
                name: chatbot-external
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
