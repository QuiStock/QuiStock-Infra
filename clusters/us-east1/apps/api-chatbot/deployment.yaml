apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-chatbot
  namespace: api-chatbot
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api-chatbot
  template:
    metadata:
      labels:
        app: api-chatbot
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      terminationGracePeriodSeconds: 30
      containers:
        - name: api-chatbot
          image: ghcr.io/quistock/ai-multi-agent@sha256:e82fe73950735c91cdc17cb61c285446a81c93b8a0fc360e9daa832f8a74a914
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: AUTH_BYPASS_LOCAL_TESTS
              value: "false"
            - name: APP_ENVIRONMENT
              value: "production"
          envFrom:
            - configMapRef:
                name: chatbot-config
            - secretRef:
                name: chatbot-external
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health
              port: http
            timeoutSeconds: 20
            periodSeconds: 30
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
        - name: summary-worker
          image: ghcr.io/quistock/ai-multi-agent-worker@sha256:8d50da1372dd8abef114c4bd3d91dfdf618408a55a3b8f2e76950a8acea2acbb
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "src.memory.worker.run_summary_worker"]
          env:
            - name: AUTH_BYPASS_LOCAL_TESTS
              value: "false"
            - name: APP_ENVIRONMENT
              value: "production"
          envFrom:
            - configMapRef:
                name: chatbot-config
            - secretRef:
                name: chatbot-external
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
