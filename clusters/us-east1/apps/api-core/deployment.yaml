apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-core
  namespace: api-core
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api-core
  template:
    metadata:
      labels:
        app: api-core
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      terminationGracePeriodSeconds: 30
      containers:
        - name: api-core
          image: ghcr.io/quistock/ds-backend@sha256:5f168f4166db87932f53a8d44b24dec9de4cea2bfbbe2f4e20a682d96550453d
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ANALYSIS_SCHEDULE_ENABLED
              value: "false"
            - name: AI_API_BASE_URL
              value: http://api-chatbot.api-chatbot.svc.cluster.local
            - name: AI_CONNECT_TIMEOUT_MS
              value: "3000"
            - name: AI_READ_TIMEOUT_MS
              value: "24000"
            - name: RUN_MIGRATIONS
              value: "true"
            - name: SERVER_FORWARD_HEADERS_STRATEGY
              value: framework
            - name: COOKIE_SECURE
              value: "true"
            - name: CSRF_COOKIE_SECURE
              value: "true"
            - name: CSRF_COOKIE_SAME_SITE
              value: "None"
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: api-runtime
                  key: CORS_ALLOWED_ORIGINS
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: core-external
                  key: DB_URL
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: core-external
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: core-external
                  key: DB_PASSWORD
            - name: AUTH_JWT_ISSUER
              valueFrom:
                secretKeyRef:
                  name: core-external
                  key: AUTH_JWT_ISSUER
            - name: AUTH_JWT_JWK_SET_URI
              value: http://api-auth.api-auth.svc.cluster.local/.well-known/jwks.json
            - name: AUTH_JWT_AUDIENCE
              value: quistock-api
            # O ambiente de teste ainda não tem integração ERP.
            - name: ERP_SYNC_ENABLED
              value: "false"
            - name: HEALTH_ERP_REQUIRED
              value: "false"
            - name: HEALTH_TIMEOUT_MS
              value: "4000"
            - name: HEALTH_CACHE_TTL
              value: "5s"
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "3"
            - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
              value: "0"
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            timeoutSeconds: 6
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
