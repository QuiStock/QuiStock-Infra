apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-core
  namespace: api-core
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api-core
  template:
    metadata:
      labels:
        app: api-core
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
        cloud.google.com/compute-class: autopilot-arm
      terminationGracePeriodSeconds: 30
      containers:
        - name: api-core
          image: ghcr.io/quistock/ds-backend@sha256:4140b17e7d36f51a231ae694e8c8f53358afb0fe93be6f4182cca026302461d7
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: core-external
                  key: DB_URL
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: core-external
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: core-external
                  key: DB_PASSWORD
            - name: AUTH_JWT_ISSUER
              valueFrom:
                secretKeyRef:
                  name: core-external
                  key: AUTH_JWT_ISSUER
            - name: AUTH_JWT_JWK_SET_URI
              value: http://api-auth.api-auth.svc.cluster.local/.well-known/jwks.json
            - name: AUTH_JWT_AUDIENCE
              value: quistock-api
            # O ambiente de teste ainda não tem integração ERP.
            - name: ERP_SYNC_ENABLED
              value: "false"
            - name: HEALTH_ERP_REQUIRED
              value: "false"
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
