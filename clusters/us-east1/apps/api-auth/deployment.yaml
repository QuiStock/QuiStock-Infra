apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-auth
  namespace: api-auth
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api-auth
  template:
    metadata:
      labels:
        app: api-auth
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      terminationGracePeriodSeconds: 30
      containers:
        - name: api-auth
          image: ghcr.io/quistock/ds-auth@sha256:23193da1cdad9366a9531620625a8fc49005eefc177892f6e793044e75a75f77
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # Shared test database: schema is managed outside this deployment.
            - name: RUN_MIGRATIONS
              value: "false"
            - name: SPRING_FLYWAY_ENABLED
              value: "false"
            - name: SPRING_LIQUIBASE_ENABLED
              value: "false"
            - name: SPRING_SQL_INIT_MODE
              value: "never"
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "none"
            - name: SPRING_JPA_GENERATE_DDL
              value: "false"
            - name: SERVER_FORWARD_HEADERS_STRATEGY
              value: framework
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: api-runtime
                  key: CORS_ALLOWED_ORIGINS
            # Frontend and API URLs are separate: allow secure cross-site cookies.
            - name: AUTH_COOKIE_SAME_SITE
              value: "None"
            - name: AUTH_COOKIE_SECURE
              value: "true"
            - name: AUTH_COOKIE_PATH
              value: "/"
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: auth-external
                  key: DB_URL
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: auth-external
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-external
                  key: DB_PASSWORD
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: auth-external
                  key: MONGODB_URI
            - name: MONGODB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: auth-external
                  key: MONGODB_DATABASE
            - name: AUTH_JWT_ISSUER
              valueFrom:
                secretKeyRef:
                  name: auth-external
                  key: AUTH_JWT_ISSUER
            - name: AUTH_JWT_PRIVATE_KEY_BASE64
              valueFrom:
                secretKeyRef:
                  name: auth-external
                  key: AUTH_JWT_PRIVATE_KEY_BASE64
            - name: AUTH_JWT_PUBLIC_KEY_BASE64
              valueFrom:
                secretKeyRef:
                  name: auth-external
                  key: AUTH_JWT_PUBLIC_KEY_BASE64
            - name: AUTH_JWT_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: auth-external
                  key: AUTH_JWT_KEY_ID
            - name: AUTH_RATE_LIMIT_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-external
                  key: AUTH_RATE_LIMIT_HMAC_KEY
            - name: AUTH_JWT_AUDIENCE
              value: quistock-api
            - name: HEALTH_TIMEOUT_MS
              value: "4000"
            - name: HEALTH_CACHE_TTL
              value: "5s"
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "3"
            - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
              value: "0"
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health
              port: http
            timeoutSeconds: 6
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
