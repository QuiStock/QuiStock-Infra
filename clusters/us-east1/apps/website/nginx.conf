events {}
http {
  resolver kube-dns.kube-system.svc.cluster.local valid=10s;
  server {
    listen 8080 default_server;
    server_name _;
    client_max_body_size 10m;

    # HTTPS terminates at API Gateway. CORS is handled there, not in Spring.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Origin "";
    proxy_read_timeout 30s;

    location = /website-health { return 200 'ok'; }
    # Preserve the existing NLB health-check contract.
    location = /edge-health { return 200 'ok'; }

    # Core's native routes have no /api prefix; retain method/body/query string.
    location = /api {
      set $core api-core.api-core.svc.cluster.local;
      rewrite ^ / break;
      proxy_pass http://$core;
    }
    location /api/ {
      set $core api-core.api-core.svc.cluster.local;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://$core;
    }
    # Auth already exposes /auth/login, /auth/refresh and /auth/logout.
    location = /auth {
      set $auth api-auth.api-auth.svc.cluster.local;
      proxy_pass http://$auth;
    }
    location /auth/ {
      set $auth api-auth.api-auth.svc.cluster.local;
      proxy_pass http://$auth;
    }
    location = /auth/health {
      set $auth api-auth.api-auth.svc.cluster.local;
      rewrite ^ /health break;
      proxy_pass http://$auth;
    }
    location = /auth/.well-known/jwks.json {
      set $auth api-auth.api-auth.svc.cluster.local;
      rewrite ^ /.well-known/jwks.json break;
      proxy_pass http://$auth;
    }
    root /usr/share/nginx/html;
    index index.html;
    location /assets/ { try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-store"; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
