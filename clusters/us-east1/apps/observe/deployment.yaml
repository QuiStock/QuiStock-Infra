apiVersion: apps/v1
kind: Deployment
metadata:
  name: observe
  namespace: observe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: observe
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: observe
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: observe
          image: REPLACE_WITH_OBSERVER_ARM64_IMAGE_DIGEST
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /observe-health
              port: http
          livenessProbe:
            httpGet:
              path: /observe-health
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
