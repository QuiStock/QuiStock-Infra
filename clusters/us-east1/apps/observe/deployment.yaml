apiVersion: apps/v1
kind: Deployment
metadata:
  name: observe
  namespace: observe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: observe
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: observe
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: observe
          image: ghcr.io/quistock/ai-observe@sha256:98586cba05e03d137f1176aee53504d4b098e9fac0a156ea55bb64b4d11a3b89
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /observe-health
              port: http
          livenessProbe:
            httpGet:
              path: /observe-health
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
