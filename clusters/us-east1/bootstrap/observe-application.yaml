apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observe
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/QuiStock/QuiStock-Infra.git
    targetRevision: main
    path: clusters/us-east1/apps/observe
  destination:
    server: https://kubernetes.default.svc
    namespace: observe
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
