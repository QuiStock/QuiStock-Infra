# Argo CD para EKS ARM64. Chart argo/argo-cd 10.9.6.
# UI interna: kubectl port-forward svc/argocd-server -n argocd 8443:443.
global:
  nodeSelector:
    kubernetes.io/arch: arm64
server:
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

controller:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi

repoServer:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi

redis:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

# Ainda não usamos SSO, ApplicationSets ou notificações.
dex:
  enabled: false

applicationSet:
  replicas: 0

notifications:
  enabled: false
