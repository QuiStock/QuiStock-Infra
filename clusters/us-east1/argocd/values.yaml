# Argo CD para GKE Autopilot. Chart argo/argo-cd 10.9.6.
# A UI recebe um IP externo do GKE. O Argo CD mantém TLS no servidor.
server:
  service:
    type: LoadBalancer
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

controller:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi

repoServer:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi

redis:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

# Ainda não usamos SSO, ApplicationSets ou notificações.
dex:
  enabled: false

applicationSet:
  replicas: 0

notifications:
  enabled: false
