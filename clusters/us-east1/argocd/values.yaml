# Argo CD para EKS ARM64. Chart argo/argo-cd 10.9.6.
# NLB público encaminha TCP 443 para o HTTPS do Argo CD na NodePort 30081.
global:
  nodeSelector:
    kubernetes.io/arch: arm64
configs:
  params:
    server.insecure: false
  cm:
    users.anonymous.enabled: "false"
server:
  service:
    type: NodePort
    nodePortHttp: 30082
    nodePortHttps: 30081
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

controller:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi

repoServer:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi

redis:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

# Ainda não usamos SSO, ApplicationSets ou notificações.
dex:
  enabled: false

applicationSet:
  replicas: 0

notifications:
  enabled: false
