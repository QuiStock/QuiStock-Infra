# Argo CD para EKS ARM64. Chart argo/argo-cd 10.9.6.
# HTTPS termina no CloudFront; origem HTTP privada na porta NodePort 30081.
global:
  nodeSelector:
    kubernetes.io/arch: arm64
configs:
  params:
    server.insecure: true
server:
  service:
    type: NodePort
    nodePortHttp: 30081
    nodePortHttps: 30082
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

controller:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi

repoServer:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi

redis:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

# Ainda não usamos SSO, ApplicationSets ou notificações.
dex:
  enabled: false

applicationSet:
  replicas: 0

notifications:
  enabled: false
