apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ds-backend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/QuiStock/QuiStock-Infra.git
    targetRevision: main
    path: clusters/expotech/apps/ds-backend
  destination:
    server: https://kubernetes.default.svc
    namespace: api-core
  syncPolicy:
    automated:
      selfHeal: true
