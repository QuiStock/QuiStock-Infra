apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: quistock-nodepools
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/QuiStock/QuiStock-Infra.git
    targetRevision: main
    path: clusters/expotech/nodepools
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
